name: Dependabot Vite+ pins

# Completes Dependabot's `vite-plus` group PR. Dependabot bumps vite-plus and
# @voidzero-dev/* but cannot move the pins that must follow them: the `vite`
# alias (npm:@voidzero-dev/vite-plus-core@<version>, in package.json and in the
# pnpm-workspace.yaml overrides) and @vitest/coverage-v8 and vitest (the vitest
# that vite-plus bundles). This job moves them
# (scripts/sync-vite-plus-pins.mjs), refreshes the
# lockfile, pushes the commit on the PR branch and starts CI again (a
# GITHUB_TOKEN push starts no workflow). CI watch then merges the PR as any
# green Dependabot PR.

on:
  pull_request:
    branches: [main]
    paths: ['package.json', 'pnpm-workspace.yaml']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Move the vite-plus pins
    # Dependabot's own branches only, never a fork.
    if: >-
      github.actor == 'dependabot[bot]'
      && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # The project is driven by pnpm, installed below: skip the npm cache.
          package-manager-cache: false

      - name: Move the pins, refresh the lockfile
        id: sync
        run: |
          set -euo pipefail
          result=$(node scripts/sync-vite-plus-pins.mjs)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = changed ]; then
            # The pnpm that package.json's packageManager pins writes the lockfile;
            # installed from outside the project (devEngines refuses any other).
            pnpm_version=$(jq -er '.packageManager | select(startswith("pnpm@")) | ltrimstr("pnpm@")' package.json)
            (cd "$RUNNER_TEMP" && npm install -g "pnpm@${pnpm_version}")
            pnpm install --lockfile-only --ignore-scripts
            git diff --stat
          fi

      - name: Push and start CI
        if: steps.sync.outputs.result == 'changed'
        run: |
          set -euo pipefail
          version=$(jq -r '.devDependencies["vite-plus"]' package.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "build(deps): move the vite-plus pins to $version"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
